name: Build MN SHOT APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Check editor JavaScript syntax
        run: node --check app/src/main/assets/mnshot.js
      - name: Verify project files
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/mnshot.css
          grep -q 'MN SHOT' app/src/main/assets/index.html
          grep -q 'MNCutNativeMp4' app/src/main/assets/mnshot.js
          grep -q 'onNativeMp4Result' app/src/main/assets/mnshot.js
          grep -q '__mnBack' app/src/main/assets/mnshot.js
          grep -q 'media3-transformer' app/build.gradle
          grep -q 'NativeMp4Bridge' app/src/main/java/com/mnshot/studio/MainActivity.java
          grep -q '__mnBack' app/src/main/java/com/mnshot/studio/MainActivity.java
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f settings.gradle
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
